[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-sales-experiment-lab"
version = "0.1.0"
description = "An honest, local outreach experiment notebook"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sel = "sel.cli:main"

[tool.setuptools]
packages = ["sel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
